<div class="mx-auto max-w-xl space-y-4 p-4">
  <h1 class="text-xl font-semibold">Plan a trip</h1>
  <textarea
    [(ngModel)]="prompt"
    placeholder="Describe the trip"
    rows="4"
    class="w-full rounded-md border border-slate-300 p-3 text-sm focus:border-slate-500 focus:outline-none"></textarea>
  <p class="text-sm text-slate-600">{{ geoStatus }}</p>
  <ui-button role="start-plan" (click)="startPlanning()">Start planning</ui-button>
</div>
