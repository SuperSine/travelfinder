<section class="mx-auto grid min-h-[calc(100vh-3.5rem)] max-w-6xl grid-cols-1 lg:grid-cols-2">
  <aside class="flex flex-col border-b border-slate-200 lg:border-b-0 lg:border-r">
    <app-chat-panel
      [messages]="messages"
      [clarification]="store.snapshot().clarification"
      [phase]="store.snapshot().phase"
      (send)="onSend($event)"></app-chat-panel>
    <app-itinerary-cards
      [stops]="store.snapshot().stops"
      (select)="onStopSelect($event)"></app-itinerary-cards>
  </aside>
  <app-map
    class="min-h-[20rem]"
    [places]="store.snapshot().places"
    [selectedId]="selectedId"
    [stopOrder]="stopIds"
    [needsMapPick]="needsMapPick"
    (placeSelect)="onPlaceSelect($event)"
    (mapPick)="onMapPick($event)"></app-map>
</section>
